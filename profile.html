    <meta charset="UTF-8">

    <!-- Profile CSS -->

         ===================================================== -->

        <div class="sidebar-logo">

            🎓 StudyHub

        </div>


        <nav class="sidebar-nav">


            <div class="nav-title">

            </div>


            <a href="dashboard.html" class="nav-link">

            </a>


            <a href="courses.html" class="nav-link">

                📚

            </a>


            <a href="notes.html" class="nav-link">

            </a>


            <a href="tasks.html" class="nav-link">

                ✅
                <span>Tasks</span>

            </a>


            <div class="nav-title">
                TOOLS
            </div>


            <!-- SECTION 8 -->

            <a href="quiz.html" class="nav-link">

                🧠
                <span>Quiz</span>

            </a>


            <!-- SECTION 9 -->

            <a href="pomodoro.html" class="nav-link">

                ⏱️

            </a>


            <!-- SECTION 10 -->

            <a href="expenses.html" class="nav-link">

                💰

            <!-- SECTION 11 -->

            <a href="progress.html" class="nav-link">

            <!-- SECTION 12 -->

            <div class="nav-title">

            <!-- SECTION 17 -->

            <a href="profile.html" class="nav-link active">

                👤
                <span>Profile</span>

            </a>


            <!-- SECTION 15 -->

            <a href="settings.html" class="nav-link">

                ⚙️
                <span>Settings</span>

            </a>


        </nav>


        <!-- =================================================
             LOGOUT
             ================================================= -->

        <div class="sidebar-bottom">

            <button id="logoutBtn" class="logout-btn">

                🚪

                <span>
                    Logout
                </span>

            </button>

        </div>


    </aside>



    <!-- =====================================================
         MAIN CONTENT
         ===================================================== -->

    <main class="profile-main">


        <!-- =================================================
             HEADER
             ================================================= -->

        <header class="profile-header">

            <span class="profile-badge">
                👤 MY ACCOUNT
            </span>


            <h1>
                My Profile
            </h1>


            <p>
                Manage your personal information and profile.
            </p>

        </header>



        <!-- =================================================
             PROFILE CONTAINER
             ================================================= -->

        <section class="profile-container">


            <!-- =================================================
                 PROFILE TOP
                 ================================================= -->

            <div class="profile-top">


                <div class="profile-picture-area">



                    <div class="profile-image-box">

                        <img id="profileImage" src="" alt="Profile Picture">

                        <div id="defaultAvatar" class="default-avatar">

                            👤

                        </div>

                    </div>


                    <div class="photo-buttons">

                        <label for="imageUpload" class="upload-btn">

                            📷 Change Photo

                        </label>


                        <button id="removePhotoBtn" class="remove-photo-btn">

                            🗑️ Remove Photo

                        </button>

                    </div>


                    <input type="file" id="imageUpload" accept="image/*">

                </div>


                <div class="profile-intro">

                    <h2 id="profileNameDisplay">
                        Maiz Bhojani
                    </h2>


                    <p id="profileEmailDisplay">
                        student@studyhub.com
                    </p>


                    <span class="student-badge">
                        🎓 Student
                    </span>

                </div>


            </div>



            <!-- =================================================
                 PROFILE FORM
                 ================================================= -->

            <div class="profile-form">


                <h2>
                    Personal Information
                </h2>


                <div class="form-grid">


                    <!-- NAME -->

                    <div class="form-group">

                        <label>
                            Full Name
                        </label>

                        <input type="text" id="nameInput" value="Maiz Bhojani" placeholder="Enter your name">

                    </div>



                    <!-- EMAIL -->

                    <div class="form-group">

                        <label>
                            Email Address
                        </label>

                        <input type="email" id="emailInput" value="student@studyhub.com" placeholder="Enter your email">

                    </div>



                    <!-- EDUCATION -->

                    <div class="form-group">

                        <label>
                            Education
                        </label>

                        <input type="text" id="educationInput" value="H.S.C Student" placeholder="Enter your education">

                    </div>



                    <!-- ROLE -->

                    <div class="form-group">

                        <label>
                            Role
                        </label>

                        <input type="text" id="roleInput" value="Student" placeholder="Enter your role">

                    </div>



                    <!-- SKILLS -->

                    <div class="form-group full-width">

                        <label>
                            Skills
                        </label>

                        <input type="text" id="skillsInput" value="HTML, CSS, JavaScript"
                            placeholder="Example: HTML, CSS, JavaScript">

                    </div>


                </div>


                <!-- SAVE BUTTON -->

                <button id="saveProfileBtn" class="save-profile-btn">

                    💾 Save Changes

                </button>


                <p id="saveMessage" class="save-message">

                </p>


            </div>


        </section>


    </main>



    <!-- =====================================================
         JAVASCRIPT
         ===================================================== -->

    <script src="js/storage.js"></script>
    <script src="js/profile.js"></script>

</body>

</html>
